[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "care-events"
version = "0.1.0"
description = "AdaptiveCare Flow: event envelope, message bus (in-memory and RabbitMQ), outbox and inbox"
requires-python = ">=3.12"
dependencies = ["sqlalchemy>=2.0"]

[project.optional-dependencies]
rabbit = ["pika>=1.3"]

[tool.setuptools.packages.find]
where = ["src"]
