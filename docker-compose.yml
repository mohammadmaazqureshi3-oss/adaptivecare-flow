# AdaptiveCare Flow — the whole platform with one command (NFR-POR-01):
#   cp .env.example .env && docker compose up --build
# Users reach the system only through the gateway (8000) and the web app (8080).
# Engine containers are not listed: the deployer starts one per deployed pathway
# version from Sprint 4 (plan Section 9). The image is built under the "engine" profile.

name: adaptivecare  # fixes the network name engines join: adaptivecare_default

x-service: &service
  restart: unless-stopped
  env_file: .env
  depends_on:
    postgres: { condition: service_healthy }
    rabbitmq: { condition: service_healthy }

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: adaptivecare
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d adaptivecare"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    # The topic exchange care.events is declared by the services themselves (contracts/events.md).
    ports: ["15672:15672"]  # management UI, for development only
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  gateway:
    <<: *service
    build: { context: ., dockerfile: services/gateway/Dockerfile }
    ports: ["8000:8000"]

  auth:
    <<: *service
    build: { context: ., dockerfile: services/auth/Dockerfile }

  designer:
    <<: *service
    build: { context: ., dockerfile: services/designer/Dockerfile }

  verifier:
    <<: *service
    build: { context: ., dockerfile: services/verifier/Dockerfile }
    depends_on: []  # stateless: needs neither the database nor the broker

  simulator:
    <<: *service
    build: { context: ., dockerfile: services/simulator/Dockerfile }

  deployer:
    <<: *service
    build: { context: ., dockerfile: services/deployer/Dockerfile }
    # NFR-SEC-04: least privilege. Only the deployer may reach the Docker socket, and it
    # runs as root only because the socket belongs to root; no other service does.
    user: "0"
    environment:
      ENGINE_IMAGE: adaptivecare/engine:dev
      ENGINE_NETWORK: adaptivecare_default
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

  worklist:
    <<: *service
    build: { context: ., dockerfile: services/worklist/Dockerfile }

  patient:
    <<: *service
    build: { context: ., dockerfile: services/patient/Dockerfile }

  ml:
    <<: *service
    build: { context: ., dockerfile: services/ml/Dockerfile }

  scores:
    # CLN-04: a new task type as a new service (NEWS2); no engine change
    <<: *service
    build: { context: ., dockerfile: services/scores/Dockerfile }

  engine:
    # Image only: the deployer starts one container per deployed version (DEP-01).
    # Build it with: docker compose --profile engine build engine
    build: { context: ., dockerfile: services/engine/Dockerfile }
    image: adaptivecare/engine:dev
    profiles: ["engine"]

  prometheus:
    # MON-03 (Should): docker compose --profile monitoring up -d, then http://localhost:9090
    image: prom/prometheus:v3.5.0
    profiles: ["monitoring"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    # MON-03: docker compose --profile monitoring up -d, then http://localhost:3000
    # (admin / GRAFANA_ADMIN_PASSWORD from .env); the AdaptiveCare dashboard is provisioned.
    image: grafana/grafana:11.5.2
    profiles: ["monitoring"]
    depends_on: [prometheus]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-dev-only}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]

  web:
    # HTTPS (plan C4-03): https://localhost:8443; http://localhost:8080 redirects there.
    # A self-signed certificate is made at start; for a real one, uncomment the volume
    # with cert.pem and key.pem in ./tls.
    build: { context: ., dockerfile: web/Dockerfile }
    depends_on: [gateway]
    environment:
      HTTPS_PORT: "8443"
    # volumes: ["./tls:/etc/nginx/tls:ro"]
    ports: ["8080:80", "8443:443"]

volumes:
  pgdata:
