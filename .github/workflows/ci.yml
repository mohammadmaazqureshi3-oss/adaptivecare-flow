# Runs on every push (plan Section 13, Definition of Done): lint, types, tests with
# coverage, complexity, security scans, then builds the images.
name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e packages/pathway-core -e packages/care-events -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check packages services scripts tests && ruff format --check packages services scripts tests
      - name: Types (mypy)
        run: mypy packages/pathway-core/src services/verifier/verifier services/auth/auth services/gateway/gateway services/designer/designer services/patient/patient services/engine/engine services/worklist/worklist services/ml/ml services/deployer/deployer services/simulator/simulator packages/care-events/src services/ml/training
      - name: Tests and coverage (NFR-MNT-01)
        run: python -m pytest --cov --cov-report=term
      - name: Complexity (NFR-MNT-02)
        # radon only lists functions rated C or worse (complexity > 10); any output fails the job.
        run: |
          found="$(radon cc -n C -s packages/pathway-core/src services scripts -e '*/tests/*')"
          if [ -n "$found" ]; then echo "$found"; exit 1; fi
      - name: Security (NFR-SEC-06)
        run: |
          bandit -q -r packages/pathway-core/src services -x "*/tests/*"
          pip-audit -r requirements-dev.txt

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  images:
    needs: [quality, web]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: cp .env.example .env && docker compose --profile engine build
